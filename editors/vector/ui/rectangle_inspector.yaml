schema: pengui/v1
root:
  type: panel
  padding: 0
  gap: 8
  children:
    - {type: label, text: Rechteck, height: 24}
    - type: row
      padding: 0
      gap: 8
      height: 28
      children:
        - {type: label, text: Name, width: 64}
        - {type: input, id: rectangle_name, action: vector.rectangle.name}
    - type: row
      padding: 0
      gap: 8
      height: 28
      children:
        - {type: label, text: Breite, width: 64}
        - {type: input, id: rectangle_width, action: vector.rectangle.width}
    - type: row
      padding: 0
      gap: 8
      height: 28
      children:
        - {type: label, text: Hoehe, width: 64}
        - {type: input, id: rectangle_height, action: vector.rectangle.height}
    - {type: checkbox, id: rectangle_visible, text: Sichtbar, action: vector.rectangle.visible, height: 28}
    - {type: checkbox, id: rectangle_locked, text: Gesperrt, action: vector.rectangle.locked, height: 28}
    - {type: label, id: rectangle_edit_hint, text: "", height: 24}
    - type: popup_button
      id: rectangle_fill_button
      text: Fuellfarbe
      icon: tabler:palette
      placement: below
      height: 28
      popup_width: 260
      popup_height: 304
      children:
        - type: panel
          padding: 12
          children:
            - type: color_picker
              id: rectangle_fill
              mode: hsl
              value: "#7393AFFF"
              action: vector.rectangle.fill
              preview_action: vector.rectangle.fill_preview
