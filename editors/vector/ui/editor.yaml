schema: pengui/v1
root:
  type: split
  id: vector_columns
  axis: horizontal
  flex: middle
  initial: 250
  initial_last: 250
  minimum_first: 250
  minimum_second: 250
  minimum_last: 250
  gap: 9
  children:
    - type: tabs
      id: vector_navigation_tabs
      children:
        - type: tab
          id: vector_explorer_tab
          text: Explorer
          icon: tabler:folder
          padding: 0
          children:
            - type: panel
              padding: 12
              children:
                - {type: label, text: "Vector workspace"}
                - {type: label, text: "No document opened."}
                - {type: spacer}
        - type: tab
          id: vector_document_tree_tab
          text: Document
          icon: tabler:stack-2
          padding: 0
          children:
            - type: panel
              padding: 8
              children:
                - {type: tree, id: vector_document_tree}
    - type: column
      padding: 0
      gap: 3
      children:
        - type: toolbar
          height: 40
          padding: 5
          gap: 4
          children:
            - {type: button, id: vector_add_document, icon: tabler:file-plus, action: vector.add_document, width: 30}
            - {type: separator}
            - {type: toggle, id: vector_add_artboard, icon: tabler:artboard, action: vector.add_artboard, width: 30}
            - {type: spacer}

        - type: tabs
          id: vector_document_tabs
          children:
            - type: tab
              id: vector_workspace_tab
              text: Vector
              padding: 0
              children:
                - type: panel
                  padding: 16
                  gap: 8
                  children:
                    - {type: label, text: "Vector Editor", height: 30}
                    - {type: label, text: "No document opened."}
                    - {type: spacer}
    - type: tabs
      children:
        - type: tab
          id: vector_inspector_tab
          text: Inspector
          padding: 0
          children:
            - {type: slot, id: inspector_content}
