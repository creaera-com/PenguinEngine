schema: pengui/v1
root:
  type: split
  id: vector_columns
  axis: horizontal
  flex: middle
  initial: 250
  initial_last: 250
  minimum_first: 250
  minimum_second: 250
  minimum_last: 250
  gap: 9
  children:
    - type: tabs
      id: vector_navigation_tabs
      children:
        - type: tab
          id: vector_explorer_tab
          text: Explorer
          icon: tabler:folder
          padding: 0
          children:
            - type: panel
              padding: 12
              children:
                - {type: label, text: "Vector workspace"}
                - {type: label, text: "No document opened."}
                - {type: spacer}
        - type: tab
          id: vector_document_tree_tab
          text: Document
          checked: true
          icon: tabler:stack-2
          padding: 0
          children:
            - type: panel
              padding: 8
              children:
                - {type: tree, id: vector_document_tree}
    - type: column
      padding: 0
      gap: 3
      children:
        - type: toolbar
          height: 40
          padding: 5
          gap: 4
          children:
            - {type: button, id: vector_add_document, icon: tabler:file-plus, action: vector.add_document, width: 30}
            - {type: separator}
            - {type: toggle, id: vector_add_artboard, icon: tabler:artboard, action: vector.add_artboard, width: 30}
            - {type: separator}
            - {type: toggle, id: vector_add_rect, icon: tabler:rectangle, action: vector.add_rect, width: 30}
            - {type: toggle, id: vector_selection, icon: tabler:pointer-2, action: vector.tool_selection, width: 30}
            - {type: separator}
            - {type: toggle, id: vector_grid_toggle, icon: tabler:grid-4x4, action: vector.grid.toggle, width: 30}
            - {type: spacer}

        - type: tabs
          id: vector_document_tabs
          children: []
    - type: split
      id: vector_right_split
      axis: vertical
      flex: first
      initial_last: 210
      minimum_first: 200
      minimum_second: 180
      gap: 9
      children:
        - type: tabs
          children:
            - type: tab
              id: vector_inspector_tab
              text: Inspector
              padding: 0
              children:
                - {type: slot, id: inspector_content}
        - type: tabs
          children:
            - type: tab
              id: vector_tools_tab
              text: Tools
              padding: 0
              children:
                - type: panel
                  padding: 12
                  gap: 8
                  children:
                    - type: dropdown
                      id: vector_grid_type
                      action: vector.grid.type
                      value: standard
                      height: 28
                      children:
                        - {type: option, text: Standard, value: standard}
                        - {type: option, text: Hexagonal, value: hexagonal}
                    - type: row
                      padding: 0
                      height: 28
                      gap: 8
                      children:
                        - {type: label, text: Breite, width: 64}
                        - {type: input, id: vector_grid_width, text: "16", action: vector.grid.width}
                    - type: row
                      padding: 0
                      height: 28
                      gap: 8
                      children:
                        - {type: label, text: Hoehe, width: 64}
                        - {type: input, id: vector_grid_height, text: "16", action: vector.grid.height}
                    - type: popup_button
                      text: Rasterfarbe
                      icon: tabler:palette
                      placement: below
                      height: 28
                      popup_width: 260
                      popup_height: 304
                      children:
                        - type: panel
                          padding: 12
                          children:
                            - {type: color_picker, id: vector_grid_color, value: "#80808080", action: vector.grid.color}
