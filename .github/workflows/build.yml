name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --config Debug --parallel 4
      - name: Test (Unity and SDL smoke)
        run: ctest --test-dir build -C Debug --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-asan -DPENGUIN_BUILD_EDITOR=ON -DSDL_UNIX_CONSOLE_BUILD=ON -DPENGUIN_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-asan --parallel 4
      - run: ctest --test-dir build-asan --output-on-failure

  documentation-and-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation and formatting tools
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen
          python -m pip install clang-format==23.1.3
      - name: Check owned C sources
        run: python tools/format_code.py --check
      - name: Configure API documentation without SDL
        run: cmake -S . -B build-docs -DPENGUIN_BUILD_EDITOR=OFF -DBUILD_TESTING=OFF
      - name: Generate API documentation
        run: cmake --build build-docs --target api_docs
      - uses: actions/upload-artifact@v4
        with:
          name: penguin-api-documentation
          path: build-docs/docs/html
