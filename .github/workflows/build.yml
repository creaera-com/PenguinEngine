name: pengUI build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --config Debug --parallel 4
      - run: ctest --test-dir build -C Debug --output-on-failure
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DPENGUI_BUILD_SDL=OFF -DPENGUI_BUILD_APP=OFF
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DPENGUI_SANITIZERS=ON -DSDL_UNIX_CONSOLE_BUILD=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install clang-format==23.1.3
      - run: python tools/format_code.py --check
      - run: python tools/check_architecture.py
