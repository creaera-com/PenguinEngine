schema: penguin.ui/v1
kind: editor
id: vector
document_provider: vector

toolbar:
  - {type: button, id: vector_new, icon: file, tooltip: "New SVG", action: vector.new}
  - {type: button, id: vector_open, icon: folder, tooltip: "Open SVG", action: vector.open}
  - {type: button, id: vector_save_as, icon: save, tooltip: "Save SVG as", action: vector.save_as}
  - {type: separator, id: vector_files_gap}
  - {type: button, id: vector_select, icon: select, tooltip: "Select / move (V), Shift: multi-select", action: vector.select}
  - {type: button, id: vector_rect, icon: rectangle, tooltip: "Rectangle (R); Shift: square", action: vector.rectangle}
  - {type: button, id: vector_ellipse, icon: collision, tooltip: "Ellipse (C); Shift: circle", action: vector.ellipse}
  - {type: button, id: vector_pen, icon: edit, tooltip: "Path (P); click nodes, Enter/double-click to close", action: vector.pen}
  - {type: button, id: vector_nodes, icon: entity, tooltip: "Edit anchors and Bezier handles (N)", action: vector.nodes}
  - {type: button, id: vector_board, icon: image, tooltip: "Draw artboard (A); Alt+drag to move", action: vector.artboard}
  - {type: separator, id: vector_zoom_gap}
  - {type: button, id: vector_zoom_out, label: "-", tooltip: "Zoom out around view center", action: vector.zoom_out}
  - {type: button, id: vector_zoom_in, label: "+", tooltip: "Zoom in around view center", action: vector.zoom_in}
  - {type: button, id: vector_zoom_reset, label: "100%", tooltip: "Reset view to 100 percent", action: vector.zoom_reset}
  - {type: button, id: vector_fit, icon: grid, tooltip: "Fit active artboard", action: vector.fit}
  - {type: separator, id: vector_grid_gap}
  - {type: button, id: vector_grid_toggle, icon: grid, tooltip: "Show / hide artboard grid", action: vector.toggle_grid}

columns:
  left:
    type: tabs
    id: vector_navigation
    tabs:
      - id: scene_tab
        title: "Objects"
        icon: layers
        content: {type: vector_tree, id: vector_objects, binding: vector.active}
      - id: explorer_tab
        title: "Explorer"
        icon: folder
        content: {type: file_tree, id: vector_files, binding: project.files}
  center: {type: vector_canvas, id: vector_canvas, binding: vector.active}
  right:
    type: tabs
    id: vector_properties
    tabs:
      - id: inspector_tab
        title: "Properties"
        icon: edit
        content: {type: vector_inspector, id: vector_inspector, binding: vector.active}
      - id: vector_tools_tab
        title: "Tools"
        icon: grid
        content:
          type: tool_panel
          id: vector_tool_panel
          children:
            - type: section
              id: vector_grid_tools
              title: "Grid"
              icon: grid
              open: true
              children:
                - {type: button, id: vector_grid_standard, label: "Standard", tooltip: "Rectangular grid", action: vector.grid_standard}
                - {type: button, id: vector_grid_isometric, label: "Isometric", tooltip: "Diamond grid; width / height define the full diamond", action: vector.grid_isometric}
                - {type: vector_grid, id: vector_grid_settings, binding: vector.active, height: 100}
            - type: section
              id: vector_preview_tools
              title: "Preview"
              icon: image
              open: true
              children:
                - {type: button, id: vector_preview_select, icon: select, label: "Select area", tooltip: "Drag a rectangle inside an artboard for a 1:1 preview", action: vector.preview_select}
                - {type: button, id: vector_preview_clear, icon: close, tooltip: "Clear preview selection", action: vector.preview_clear}
                - {type: vector_preview, id: vector_preview, binding: vector.active, height: 190}
            - type: section
              id: vector_transform_tools
              title: "Transform"
              icon: select
              open: true
              children:
                - {type: button, id: vector_flip_x, icon: right, label: "Flip X", tooltip: "Mirror horizontally", action: vector.mirror_x}
                - {type: button, id: vector_flip_y, icon: down, label: "Flip Y", tooltip: "Mirror vertically", action: vector.mirror_y}
            - type: section
              id: vector_path_tools
              title: "Paths"
              icon: edit
              open: true
              children:
                - {type: button, id: vector_convert, icon: edit, label: "Convert to path", tooltip: "Convert rectangle / ellipse to path", action: vector.convert}
                - {type: button, id: vector_curve, icon: edit, label: "Curve", tooltip: "Make selected line segment a Bezier curve", action: vector.curve}
                - {type: button, id: vector_split, icon: plus, label: "Split", tooltip: "Split selected line / curve at its midpoint", action: vector.split}
                - {type: button, id: vector_close_path, icon: check, label: "Close path", tooltip: "Close selected path", action: vector.close_path}
            - type: section
              id: vector_boolean_tools
              title: "Boolean"
              icon: layers
              open: true
              children:
                - {type: button, id: vector_union, icon: plus, label: "Union", tooltip: "Unite two filled contours", action: vector.union}
                - {type: button, id: vector_intersection, icon: layers, label: "Intersection", tooltip: "Intersection of two contours", action: vector.intersection}
                - {type: button, id: vector_difference, icon: erase, label: "Difference", tooltip: "Lower object minus upper object", action: vector.difference}
                - {type: button, id: vector_xor, icon: collision, label: "XOR", tooltip: "Exclusive areas of two contours", action: vector.xor}
            - type: section
              id: vector_object_tools
              title: "Objects"
              icon: entity
              open: true
              children:
                - {type: button, id: vector_duplicate, icon: file, label: "Duplicate", tooltip: "Duplicate selected objects", action: vector.duplicate}
                - {type: button, id: vector_raise, icon: up, label: "Raise", tooltip: "Raise object", action: vector.raise}
                - {type: button, id: vector_lower, icon: down, label: "Lower", tooltip: "Lower object", action: vector.lower}
                - {type: button, id: vector_delete, icon: delete, label: "Delete", tooltip: "Delete selected objects or active artboard", action: vector.delete}
