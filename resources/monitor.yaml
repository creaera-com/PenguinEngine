schema: pengui/v1
root:
  type: panel
  scroll: true
  padding: 8
  gap: 8
  children:
    - {type: toggle, id: process_monitor_log, text: "Performance loggen", action: monitor.log, height: 30}
    - {type: label, id: process_monitor_log_status, text: "Kein Projekt geoeffnet", height: 24}
    - {type: label, id: process_monitor_gpu_device, text: "GPU: Ermittlung ausstehend", height: 24}
    - {type: label, id: process_monitor_gpu_backend, text: "Renderer: --", height: 24}
    - {type: label, id: process_monitor_gpu_driver, text: "Treiber: --", height: 24}
    - {type: label, id: process_monitor_gpu_pipeline, text: "Effekte: --", height: 24}
    - {type: label, text: "GPU-Auslastung: nicht erfasst", height: 24}
    - {type: label, text: "GPU-FX: nur Effekttexturen", height: 24}
    - {type: label, text: "60 s | CPU: 100 % = 1 Kern", height: 24}
    - {type: canvas, id: process_monitor_cpu, height: 140}
    - {type: canvas, id: process_monitor_memory, height: 140}
    - {type: canvas, id: process_monitor_gpu_memory, height: 140}
