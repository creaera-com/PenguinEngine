# Entwurf. Der Dokumentzustand wird außerhalb der Widgetinstanzen gesichert.
schema: penguin.ui/v1
kind: editor
id: scripts
document_provider: script

toolbar:
  - type: button
    id: check
    icon: check
    tooltip: "JavaScript prüfen (F7)"
    action: script.check

columns:
  left:
    type: tabs
    id: navigation
    tabs:
      - id: explorer_tab
        title: "Explorer"
        icon: folder
        content: {type: file_tree, id: files, binding: project.files}
  center:
    type: script_editor
    id: document
    binding: document.active
  right:
    type: script_info
    id: script_info
    binding: document.active
